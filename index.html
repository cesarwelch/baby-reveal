<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <title>Una dulce sorpresa</title>
    <link rel="stylesheet" href="assets/styles.css" />

  <body>
    <canvas id="celebration-canvas" aria-hidden="true"></canvas>
    <div class="sky-decoration" aria-hidden="true"><span class="cloud cloud-one"></span><span class="cloud cloud-two"></span><span class="spark spark-one">✦</span><span class="spark spark-two">✦</span><span class="spark spark-three">✦</span></div>
    <main class="reveal-shell" aria-live="polite">
      <p class="eyebrow">Una pequeña sorpresa está por llegar</p>
      <h1 class="hero-title">¿Quién será<br /><em>nuestro pequeño</em><br />amor?</h1>

      <p class="tiny-note">Prepárate para la sorpresa ✦</p>
    </main>
    <section class="reveal-panel" aria-hidden="true"><div class="reveal-glow"></div><div class="balloon b-one"></div><div class="balloon b-two"></div><div class="balloon b-three"></div><div class="reveal-copy"><p class="eyebrow">La espera terminó</p><h2>¡Es un niño!</h2><p>Te esperamos con mucho amor.</p></div></section>
    <script>window.REVEAL_CONFIG={mode:'real',targetTime:'2026-12-25T04:00:00.000Z',result:'boy',title:'¡Es un niño!',subtitle:'Te esperamos con mucho amor.'};</script>
    <script src="assets/reveal.js"></script>
  </body>
